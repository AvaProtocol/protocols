name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  allowances:
    name: Catalog allowances on chain ${{ matrix.chain }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        chain: [1, 8453, 56, 11155111, 84532]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Verify every catalog allowance getter
        run: yarn verify:tokens --chain ${{ matrix.chain }} --allowances --json
        env:
          # Empty/unavailable secrets fall back to public RPCs. No signing keys.
          RPC_URL_1: ${{ secrets.ETHEREUM_RPC }}
          RPC_URL_8453: ${{ secrets.BASE_RPC }}
          RPC_URL_56: ${{ secrets.BNB_RPC }}
          RPC_URL_11155111: ${{ secrets.SEPOLIA_RPC }}
          RPC_URL_84532: ${{ secrets.BASE_SEPOLIA_RPC }}

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Run tests
        run: yarn test:run

      - name: Build
        run: yarn build

      - name: Verify tarball contents
        # Pack a dry-run tarball and assert the dist surface is intact.
        # Catches: missing dist files in `files`, broken exports map.
        # Since package.json declares `"type": "module"`, tsup emits
        # ESM as `index.js` and CJS as `index.cjs` — match the actual
        # filenames the exports map points at, not the legacy `.mjs`
        # convention.
        run: |
          npm pack --dry-run
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
